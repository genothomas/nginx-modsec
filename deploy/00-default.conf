# Reject HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    return 444;
}

# Reject unknown HTTPS SNI.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    ssl_reject_handshake on;
}
