# Engine config for nginx-modsec. Regenerated each build.

SecRuleEngine DetectionOnly

# Request body inspection.
SecRequestBodyAccess On
SecResponseBodyAccess Off

# Audit logging.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABCDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec/audit.log

# Debug logging.
SecDebugLog /var/log/nginx/modsec/debug.log
SecDebugLogLevel 0

# Unicode mapping required by CRS.
SecUnicodeMapFile /usr/local/modsecurity/unicode.mapping 20127
