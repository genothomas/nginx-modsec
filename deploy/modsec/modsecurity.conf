# Engine config for nginx-modsec. Regenerated each build.
# Place custom rules in /etc/nginx/modsec/override.conf.

SecRuleEngine DetectionOnly

# Switch to "On" only after reviewing audit logs and adding exclusions.
# SecRuleEngine On

# Body handling: analyze requests, do not buffer responses (memory + latency).
SecRequestBodyAccess On
SecResponseBodyAccess Off

# Audit: relevant-only logging in serial format. Volume grows with traffic;
# logrotate handles retention. Path is owned by nginx (created by install.sh).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABCDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec/audit.log

# Debug: off by default. Raise to 1-3 to diagnose rule hits during tuning.
SecDebugLog /var/log/nginx/modsec/debug.log
SecDebugLogLevel 0

# Required for CRS to evaluate non-ASCII request bytes correctly.
SecUnicodeMapFile /usr/local/modsecurity/unicode.mapping 20127