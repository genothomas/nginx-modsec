# Per-server activation:
#   modsecurity on; modsecurity_rules_file /etc/nginx/modsec/main.conf;
# Include order is fixed. Do not reorder.

Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/crs-setup.conf.example
Include /etc/nginx/modsec/rules/*.conf

IncludeOptional /etc/nginx/modsec/override.conf