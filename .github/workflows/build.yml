name: Build NGINX + ModSecurity

on:
  workflow_dispatch:
    inputs:
      nginx_channel:
        description: NGINX release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - mainline

  push:
    tags:
      - "v*"

  # Build every PR that touches the build pipeline so version-pin updates
  # are gated by a green build + verify before merge.
  pull_request:
    paths:
      - 'build/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  validate:
    name: Validate shell scripts
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n (syntax check)
        run: |
          shopt -s nullglob
          scripts=(build/*.sh scripts/*.sh deploy/*.sh)
          ((${#scripts[@]} > 0))
          bash -n "${scripts[@]}"
      - name: shellcheck
        run: |
          shopt -s nullglob
          scripts=(build/*.sh scripts/*.sh deploy/*.sh)
          ((${#scripts[@]} > 0))
          shellcheck "${scripts[@]}"

  build:
    name: ${{ matrix.architecture }} build
    timeout-minutes: 25
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    env:
      # Tag pushes have no workflow_dispatch input; channel defaults to stable.
      # Mainline releases are not auto-built from tags (see CONTRIBUTING.md).
      NGINX_CHANNEL: ${{ inputs.nginx_channel || 'stable' }}
      TARGET_ARCH: ${{ matrix.architecture }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare build root
        run: |
          sudo mkdir -p /opt/nginx
          sudo chown "$USER:$USER" /opt/nginx

      - name: Build
        shell: bash
        run: ./scripts/build-local.sh

      - name: Verify
        shell: bash
        run: ./scripts/verify.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nginx-modsec-${{ env.NGINX_CHANNEL }}-${{ env.TARGET_ARCH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            /opt/nginx/dist/${{ env.NGINX_CHANNEL }}/${{ env.TARGET_ARCH }}/*.tar.gz

  release:
    name: Release
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          source build/versions.env
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$TAG_VERSION" == "$NGINX_STABLE_VERSION" ]] ||
              {
                  echo "Tag ${TAG_VERSION} does not match NGINX stable (${NGINX_STABLE_VERSION})"
                  exit 1
              }
          echo "Tag matches NGINX stable: ${TAG_VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nginx-modsec-stable-*
          path: release-assets
          merge-multiple: false

      - name: Create combined SHA256SUMS
        shell: bash
        run: |
          cd release-assets

          mapfile -d '' tarballs < <(find . -type f -name '*.tar.gz' -print0 | sort -z)

          (( ${#tarballs[@]} == 2 )) ||
              { echo "Expected 2 tarballs, found ${#tarballs[@]}"; exit 1; }

          sha256sum "${tarballs[@]}" | sed 's#^\./##' > SHA256SUMS

          cat SHA256SUMS

      - name: Generate release notes
        shell: bash
        run: |
          source build/versions.env

          cat > release-notes.md <<EOF
          ## NGINX ${NGINX_STABLE_VERSION} — Stable

          Prebuilt NGINX Open Source binaries for Linux \`amd64\` and \`arm64\`.

          ### Included

          - NGINX ${NGINX_STABLE_VERSION}
          - OpenSSL ${OPENSSL_VERSION} (static)
          - PCRE2 ${PCRE2_VERSION} with JIT
          - ModSecurity v3 ${LIBMODSECURITY_VERSION}
          - OWASP CRS ${CRS_VERSION}
          - ModSecurity-nginx ${MODSECURITY_NGINX_VERSION}
          - GeoIP2 nginx module ${GEOIP2_MODULE_VERSION}
          - Headers-More ${HEADERS_MORE_VERSION}
          - HTTP/2 and HTTP/3
          EOF

          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/SHA256SUMS
          generate_release_notes: false
          body_path: release-notes.md
